<script type="module">
import { db } from "/komik-islami-anak/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const params = new URLSearchParams(location.search);
const comicId = params.get("id");
const cover = document.getElementById("detail-cover");
const title = document.getElementById("detail-title");
function setCover(data) {
  const id = data.coverFileId || "";
  const urls = id ? [
    "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1000",
    "https://drive.google.com/uc?export=view&id="+encodeURIComponent(id),
    data.coverUrl || ""
  ] : [data.coverUrl || ""];
  let i=0;
  const next=()=>{ if(i<urls.length && urls[i]) cover.src=urls[i++]; else cover.alt="Sampul belum tersedia"; };
  cover.onerror=next; next();
}
async function loadDetail(){
  if(!comicId){ title.textContent="Komik tidak ditemukan"; return; }
  try{
    const snap=await getDoc(doc(db,"comics",comicId));
    if(!snap.exists()) throw new Error("Data komik tidak ditemukan.");
    const data=snap.data();
    title.textContent=data.title||"Tanpa judul";
    document.getElementById("detail-category").textContent=data.category||"Komik";
    document.getElementById("detail-age").textContent=(data.age||"-").replace("-", "–")+" Tahun";
    document.getElementById("detail-pages").textContent=data.pageCount ? data.pageCount+" Hal" : (data.mimeType==="application/pdf"?"PDF":"Gambar");
    document.getElementById("detail-author").textContent=data.author||"Komik Islami Anak";
    document.getElementById("detail-description").textContent=data.description||"Baca cerita ini dan temukan pesan kebaikan di dalamnya.";
    document.getElementById("detail-message").textContent=data.moral||"Selamat membaca dan mengambil hikmah.";
    setCover(data);
    document.getElementById("start-reading").addEventListener("click",()=>{
      location.href="/komik-islami-anak/pembaca_komik/index.html?id="+encodeURIComponent(comicId);
    });
  }catch(e){ title.textContent=e.message; }
}
loadDetail();
</script>
