<meta name="theme-color" content="#176b4d"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml"></head>
<body class="bg-light-surface text-light-on-surface antialiased">
  <main class="min-h-[884px] max-w-md mx-auto px-page-margin py-gutter-xl flex flex-col justify-center gap-gutter-lg" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center gap-gutter-sm">
      <div class="w-16 h-16 rounded-xl bg-light-primary text-light-on-primary flex items-center justify-center shadow-sm">
        <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">admin_panel_settings</span>
      </div>
      <h1 class="font-headline text-display-lg-mobile text-light-primary" data-design-text-token="display-lg-mobile">
        Portal Administrator
      </h1>
      <p class="font-body text-body-md text-light-on-surface-variant text-pretty" data-design-text-token="body-md">
        Masuk untuk mengelola koleksi komik, kategori, dan cerita anak.
      </p>
    </div>

    <!-- Login Card -->
    <section class="rounded-xl bg-light-surface-container-lowest border border-light-outline-variant p-gutter-lg shadow-sm flex flex-col gap-gutter-md">
      <form action="../dashboard-admin/DashboardAdmin.html" class="flex flex-col gap-gutter-md">
        <!-- Email -->
        <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-gutter-xs w-full">
          <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Email Administrator</span>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-gutter-md text-[20px] text-light-outline pointer-events-none" aria-hidden="true">mail</span>
            <input type="email" inputmode="email" required placeholder="admin@komikislamianak.id" class="w-full min-h-12 pl-11 pr-gutter-md py-gutter-sm rounded-md bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-body text-body-md placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary/20">
          </div>
        </label>

        <!-- Password -->
        <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="password" class="flex flex-col gap-gutter-xs w-full">
          <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Kata Sandi</span>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-gutter-md text-[20px] text-light-outline pointer-events-none" aria-hidden="true">lock</span>
            <input id="admin-pass" type="password" autocomplete="current-password" required placeholder="Masukkan kata sandi" class="w-full min-h-12 pl-11 pr-11 py-gutter-sm rounded-md bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-body text-body-md placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary/20">
            <button type="button" aria-label="Tampilkan kata sandi" onclick="const i=document.getElementById(&#39;admin-pass&#39;);i.type=i.type===&#39;password&#39;?&#39;text&#39;:&#39;password&#39;;" class="absolute right-gutter-sm w-9 h-9 rounded-full flex items-center justify-center text-light-outline hover:text-light-on-surface">
              <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility</span>
            </button>
          </div>
        </label>

        <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center min-h-12 px-gutter-lg py-gutter-sm rounded-full bg-light-primary text-light-on-primary font-body text-label-lg shadow-sm hover:bg-light-primary-container active:scale-95 transition-transform duration-state-change ease-state-change mt-gutter-xs">
          <span data-design-text-token="label-lg">Masuk ke Dasbor</span>
        </button>
      </form>
    </section>

    <div class="flex justify-center">
      <a href="/beranda/index.html" class="inline-flex items-center gap-gutter-xs font-body text-label-md text-light-primary hover:underline">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_back</span>
        <span data-design-text-token="label-md">Kembali ke Beranda Anak</span>
      </a>
    </div>

  </main>
