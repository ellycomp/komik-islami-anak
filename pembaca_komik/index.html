<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
import { db } from "/komik-islami-anak/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const pdfjsLib = window.pdfjsLib;
const id=new URLSearchParams(location.search).get("id");
const area=document.getElementById("reader-content");
const prev=document.getElementById("btn-prev");
const next=document.getElementById("btn-next");
const counter=document.getElementById("page-counter");
const progress=document.getElementById("read-progress");
let pdf=null, page=1, total=1, touchX=0;
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvDWuXKGW-kvxsIfVmHA6b9vy2NIrNFj4sHbx94BphRF9OPcN1TcZz76fBJ1jo4Gky_g/exec";
let jsonpCounter = 0;
function loadPdfThroughAppsScript(fileId) {
  return new Promise((resolve, reject) => {
    const callbackName = "komikPdfCallback_" + Date.now() + "_" + (++jsonpCounter);
    const script = document.createElement("script");
    let timer;
    const cleanup = () => {
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    };
    window[callbackName] = (result) => {
      cleanup();
      if (result && result.success && result.data) resolve(result.data);
      else reject(new Error((result && result.message) || "PDF tidak berhasil diambil dari Google Drive."));
    };
    script.onerror = () => {
      cleanup();
      reject(new Error("Tidak dapat menghubungi layanan PDF. Periksa deployment Apps Script."));
    };
    timer = setTimeout(() => {
      cleanup();
      reject(new Error("Waktu pengambilan PDF habis. Ukuran PDF mungkin terlalu besar."));
    }, 120000);
    script.src = APPS_SCRIPT_URL
      + "?action=getPdf&id=" + encodeURIComponent(fileId)
      + "&callback=" + encodeURIComponent(callbackName);
    document.head.appendChild(script);
  });
}

function updateControls(){
 counter.textContent="Halaman "+page+" / "+total;
 progress.style.width=(page/total*100)+"%";
 prev.disabled=page<=1;
 next.disabled=page>=total;
 prev.style.opacity=prev.disabled?".45":"1";
 next.style.opacity=next.disabled?".45":"1";
}
async function renderPage(){
 const p=await pdf.getPage(page);
 const base=p.getViewport({scale:1});
 const isSmallScreen = window.matchMedia("(max-width: 700px)").matches;
 const scale=Math.min((area.clientWidth||window.innerWidth-32)/base.width,isSmallScreen?1.35:1.6);
 const viewport=p.getViewport({scale});
 const canvas=document.createElement("canvas");
 const context=canvas.getContext("2d");
 canvas.width=Math.floor(viewport.width);
 canvas.height=Math.floor(viewport.height);
 canvas.className="w-full h-auto rounded-xl bg-white shadow-sm";
 canvas.style.touchAction="pan-y";
 canvas.style.userSelect="none";
 canvas.style.webkitUserSelect="none";
 area.replaceChildren(canvas);
 await p.render({canvasContext:context,viewport}).promise;
 updateControls();
}
async function goTo(n){
 if(!pdf)return;
 page=Math.max(1,Math.min(total,n));
 await renderPage();
}
// Tombol navigasi: delegasi klik pada dokumen agar tetap aktif di semua ukuran layar
let buttonNavigationBusy = false;
async function navigateByButton(direction) {
  if (!pdf || buttonNavigationBusy) return;
  const target = Math.max(1, Math.min(total, page + direction));
  if (target === page) return;
  buttonNavigationBusy = true;
  prev.disabled = true;
  next.disabled = true;
  try {
    await goTo(target);
  } catch (err) {
    console.error("Navigasi tombol gagal:", err);
    counter.textContent = "Gagal membuka halaman. Coba lagi.";
  } finally {
    buttonNavigationBusy = false;
    updateControls();
  }
}
// Handler tombol khusus layar sentuh dan mouse
function bindReaderButton(button, direction) {
  let lastTouch = 0;
  const activate = event => {
    if (event) { event.preventDefault(); event.stopPropagation(); }
    navigateByButton(direction);
  };
  button.addEventListener("touchend", event => {
    lastTouch = Date.now();
    activate(event);
  }, { passive: false });
  button.addEventListener("click", event => {
    if (Date.now() - lastTouch < 800) {
      event.preventDefault(); event.stopPropagation(); return;
    }
    activate(event);
  });
  button.style.position = "relative";
  button.style.zIndex = "1000";
  button.style.pointerEvents = "auto";
  button.style.touchAction = "manipulation";
  button.style.cursor = "pointer";
}
bindReaderButton(prev, -1);
bindReaderButton(next, 1);
// Navigasi swipe HP: tangkap sentuhan di dokumen agar tidak hilang saat canvas dirender ulang
let navigationBusy = false;
let touchStart = null;
function navigateBySwipe(dx, dy) {
  if (navigationBusy || Math.abs(dx) < 30 || Math.abs(dx) < Math.abs(dy) * 1.05) return;
  const target = page + (dx < 0 ? 1 : -1);
  if (!pdf || target < 1 || target > total) return;
  navigationBusy = true;
  goTo(target)
    .catch(err => { console.error("Swipe gagal:", err); })
    .finally(() => { navigationBusy = false; });
}
document.addEventListener("touchstart", e => {
  if (!area.contains(e.target) || e.touches.length !== 1) return;
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { capture: true, passive: true });
document.addEventListener("touchmove", e => {
  if (!touchStart || !area.contains(e.target) || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy) * 1.05) e.preventDefault();
}, { capture: true, passive: false });
document.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  if (t) navigateBySwipe(t.clientX - touchStart.x, t.clientY - touchStart.y);
  touchStart = null;
}, { capture: true, passive: true });
document.addEventListener("touchcancel", () => { touchStart = null; }, true);
// Mouse desktop
let mouseStart = null;
area.addEventListener("mousedown", e => { mouseStart = { x: e.clientX, y: e.clientY }; });
document.addEventListener("mouseup", e => {
  if (!mouseStart) return;
  navigateBySwipe(e.clientX - mouseStart.x, e.clientY - mouseStart.y);
  mouseStart = null;
});
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")goTo(page+1);
 if(e.key==="ArrowLeft")goTo(page-1);
});
async function loadReader(){
 try{
  if(!id) throw new Error("ID komik tidak ditemukan. Kembali ke perpustakaan dan pilih komik.");
  const snap=await getDoc(doc(db,"comics",id));
  if(!snap.exists()) throw new Error("Data komik tidak ditemukan.");
  const d=snap.data();
  document.title=(d.title||"Pembaca Komik")+" — Komik Islami Anak";
  document.querySelector("header .font-headline").textContent=d.title||"Pembaca Komik";
  area.replaceChildren();
  if(d.mimeType==="application/pdf" && d.fileId){
    counter.textContent="Membuka buku...";
    try{
      const pdfBase64 = await loadPdfThroughAppsScript(d.fileId);
      const binary = atob(pdfBase64);
      const pdfBytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) pdfBytes[i] = binary.charCodeAt(i);
      pdf=await pdfjsLib.getDocument({data:pdfBytes, disableWorker:true, isEvalSupported:false}).promise;
      total=pdf.numPages;
      page=1;
      await renderPage();
    }catch(pdfError){
      console.error("PDF.js gagal memuat PDF:",pdfError);
      const note=document.createElement("p");
      note.className="text-center text-sm p-4 rounded-xl bg-white";
      note.textContent="PDF belum dapat dibuka di perangkat ini: " + (pdfError.message || "kesalahan pembacaan PDF") + ". Muat ulang halaman untuk mencoba lagi.";
      area.replaceChildren(note);
      counter.textContent="PDF gagal dimuat";
      prev.disabled=true;
      next.disabled=true;
    }
  } else if(d.fileUrl){
    const img=document.createElement("img");
    img.src=d.fileUrl;
    img.alt=d.title||"Halaman komik";
    img.className="w-full rounded-xl object-contain bg-white";
    area.appendChild(img);
    counter.textContent="Gambar komik";
    prev.disabled=true;next.disabled=true;
    progress.style.width="100%";
  } else {
    throw new Error("Berkas komik belum memiliki tautan. Periksa data unggahan di Google Drive.");
  }
 }catch(e){area.textContent=e.message;}
}
loadReader();
</script>
